<!-- 幻灵 Logo SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2196F3" flood-opacity="0.3"/>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 外环：代表平台生态 -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#logoGrad)" stroke-width="6" opacity="0.3"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.15" stroke-dasharray="8 6"/>

  <!-- 主体：抽象化的"幻"字 + AI神经元网络 -->
  <!-- 中心发光球体 -->
  <circle cx="100" cy="100" r="32" fill="url(#logoGrad)" filter="url(#logoShadow)" opacity="0.95"/>
  <circle cx="100" cy="100" r="20" fill="#FFFFFF" opacity="0.25"/>

  <!-- 连接节点（神经元） -->
  <circle cx="100" cy="50" r="8" fill="url(#logoGrad2)" filter="url(#logoShadow)"/>
  <circle cx="140" cy="70" r="7" fill="url(#logoGrad)" filter="url(#logoShadow)"/>
  <circle cx="148" cy="120" r="8" fill="url(#logoGrad2)" filter="url(#logoShadow)"/>
  <circle cx="130" cy="160" r="6" fill="url(#logoGrad)" filter="url(#logoShadow)"/>
  <circle cx="60" cy="155" r="7" fill="url(#logoGrad2)" filter="url(#logoShadow)"/>
  <circle cx="50" cy="105" r="8" fill="url(#logoGrad)" filter="url(#logoShadow)"/>
  <circle cx="58" cy="58" r="6" fill="url(#logoGrad2)" filter="url(#logoShadow)"/>

  <!-- 连接线 -->
  <line x1="100" y1="58" x2="100" y2="68" stroke="url(#logoGrad)" stroke-width="2" opacity="0.5"/>
  <line x1="133" y1="74" x2="120" y2="78" stroke="url(#logoGrad)" stroke-width="2" opacity="0.5"/>
  <line x1="140" y1="125" x2="126" y2="118" stroke="url(#logoGrad)" stroke-width="2" opacity="0.5"/>
  <line x1="125" y1="155" x2="114" y2="130" stroke="url(#logoGrad)" stroke-width="2" opacity="0.5"/>
  <line x1="63" y1="148" x2="80" y2="128" stroke="url(#logoGrad)" stroke-width="2" opacity="0.5"/>
  <line x1="56" y1="105" x2="68" y2="105" stroke="url(#logoGrad)" stroke-width="2" opacity="0.5"/>
  <line x1="65" y1="62" x2="80" y2="78" stroke="url(#logoGrad)" stroke-width="2" opacity="0.5"/>

  <!-- 中心 H 字母（幻灵 HuanLing 首字母） -->
  <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="0">H</text>

  <!-- 外围小点装饰 -->
  <circle cx="100" cy="18" r="2" fill="#2196F3" opacity="0.4"/>
  <circle cx="170" cy="50" r="2" fill="#00BCD4" opacity="0.4"/>
  <circle cx="182" cy="100" r="2" fill="#2196F3" opacity="0.4"/>
  <circle cx="170" cy="150" r="2" fill="#00BCD4" opacity="0.4"/>
  <circle cx="100" cy="182" r="2" fill="#2196F3" opacity="0.4"/>
  <circle cx="30" cy="150" r="2" fill="#00BCD4" opacity="0.4"/>
  <circle cx="18" cy="100" r="2" fill="#2196F3" opacity="0.4"/>
  <circle cx="30" cy="50" r="2" fill="#00BCD4" opacity="0.4"/>
</svg>
