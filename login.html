<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 幻灵</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #F5F5F7;
      color: #1D1D1F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: #FF3B30;
      color: #FFFFFF;
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.2px;
      box-shadow: 0 8px 32px rgba(255, 59, 48, 0.28);
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      background: #34C759;
      box-shadow: 0 8px 32px rgba(52, 199, 89, 0.28);
    }

    /* Card */
    .auth-card {
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.04);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .auth-card:hover {
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.1), 0 2px 4px rgba(0, 0, 0, 0.04);
    }

    /* Logo */
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo img {
      width: 72px;
      height: 72px;
      display: block;
      margin: 0 auto 16px;
      filter: drop-shadow(0 4px 12px rgba(33, 150, 243, 0.25));
    }

    .auth-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1D1D1F;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 15px;
      color: #86868B;
      font-weight: 400;
      letter-spacing: -0.2px;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1D1D1F;
      margin-bottom: 8px;
      letter-spacing: -0.1px;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 15px;
      font-family: inherit;
      color: #1D1D1F;
      background: #F5F5F7;
      border: 1.5px solid #D2D2D7;
      border-radius: 12px;
      outline: none;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      -webkit-appearance: none;
      appearance: none;
    }

    .form-input::placeholder {
      color: #86868B;
    }

    .form-input:focus {
      border-color: #007AFF;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12);
    }

    .form-input.error {
      border-color: #FF3B30;
      box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.08);
    }

    /* Password wrapper */
    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #86868B;
      padding: 6px;
      font-size: 18px;
      line-height: 1;
      transition: color 0.2s;
    }

    .password-toggle:hover {
      color: #1D1D1F;
    }

    /* Forgot password */
    .form-extra {
      display: flex;
      justify-content: flex-end;
      margin-top: -8px;
      margin-bottom: 24px;
    }

    .forgot-link {
      font-size: 13px;
      color: #007AFF;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .forgot-link:hover {
      opacity: 0.7;
    }

    /* Button */
    .btn-submit {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 24px;
      background: linear-gradient(135deg, #007AFF 0%, #0055CC 100%);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: -0.2px;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      box-shadow: 0 4px 16px rgba(0, 122, 255, 0.25);
      position: relative;
      overflow: hidden;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.35);
    }

    .btn-submit:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 2px 8px rgba(0, 122, 255, 0.2);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 4px 16px rgba(0, 122, 255, 0.15);
    }

    .btn-submit .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    .btn-submit.loading .spinner {
      display: inline-block;
    }

    .btn-submit.loading .btn-text {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer link */
    .auth-footer {
      text-align: center;
      margin-top: 28px;
    }

    .auth-footer a {
      font-size: 14px;
      color: #007AFF;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .auth-footer a:hover {
      opacity: 0.7;
    }

    .auth-footer span {
      color: #86868B;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .auth-card {
        padding: 36px 24px;
        border-radius: 16px;
      }

      .auth-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Auth Card -->
  <div class="auth-card">
    <div class="auth-logo">
      <img src="images/logo.svg" alt="幻灵 Logo">
      <h1 class="auth-title">欢迎回到幻灵</h1>
      <p class="auth-subtitle">登录你的账号，继续探索AI智能体世界</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">用户名 / 邮箱</label>
        <input
          type="text"
          id="username"
          class="form-input"
          placeholder="请输入用户名或邮箱"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="请输入密码"
            required
            autocomplete="current-password"
          >
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="显示密码">
            👁
          </button>
        </div>
      </div>

      <div class="form-extra">
        <a href="#" class="forgot-link" id="forgotPassword">忘记密码？</a>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="spinner"></span>
        <span class="btn-text">登录</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>没有账号？</span>
      <a href="register.html">立即注册 →</a>
    </div>
  </div>

  <script>
    var API_BASE = (function() {
      // 本地开发时使用 localhost:5000
      // 生产环境时替换为你的后端地址
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        return 'http://localhost:5000';
      }
      // 生产环境后端地址 - 部署后替换此处
      return 'http://localhost:5000';
    })();

    (function () {
      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');
      const passwordToggle = document.getElementById('passwordToggle');
      const forgotLink = document.getElementById('forgotPassword');
      const toast = document.getElementById('toast');

      let toastTimer = null;

      function showToast(message, type) {
        if (toastTimer) clearTimeout(toastTimer);
        toast.textContent = message;
        toast.className = 'toast ' + (type || 'error') + ' show';
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 3000);
      }

      // Password visibility toggle
      passwordToggle.addEventListener('click', function () {
        var isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        passwordToggle.textContent = isPassword ? '🙈' : '👁';
      });

      // Forgot password
      forgotLink.addEventListener('click', function (e) {
        e.preventDefault();
        showToast('请通过管理员重置密码', 'error');
      });

      // Clear error styling on input
      [usernameInput, passwordInput].forEach(function (el) {
        el.addEventListener('input', function () {
          el.classList.remove('error');
        });
      });

      // Submit
      form.addEventListener('submit', function (e) {
        e.preventDefault();

        var username = usernameInput.value.trim();
        var password = passwordInput.value;

        // Reset errors
        usernameInput.classList.remove('error');
        passwordInput.classList.remove('error');

        var hasError = false;

        if (!username) {
          usernameInput.classList.add('error');
          showToast('请输入用户名或邮箱');
          hasError = true;
        }

        if (!password) {
          passwordInput.classList.add('error');
          showToast('请输入密码');
          hasError = true;
        }

        if (hasError) return;

        // Loading state
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        fetch(API_BASE + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (res) {
            return res.json().then(function (data) {
              if (!res.ok) {
                throw new Error(data.error || '登录失败，请稍后重试');
              }
              return data;
            });
          })
          .then(function (data) {
            // Store token & user info
            localStorage.setItem('huanling_token', data.token);
            localStorage.setItem('huanling_user', JSON.stringify(data.user));
            showToast('登录成功', 'success');
            setTimeout(function () {
              window.location.href = 'index.html';
            }, 800);
          })
          .catch(function (err) {
            showToast(err.message);
          })
          .finally(function () {
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
          });
      });
    })();
  </script>

</body>
</html>
